buildscript {
    repositories {
        // Make sure that you have the following two repositories
        google()  // Google's Maven repository
        mavenCentral()  // Maven Central repository
    }
    dependencies {
        // Add the Maven coordinates and latest version of the plugin
        classpath "com.google.gms:google-services:4.4.2"
    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
// Enable dependency locking for all configurations in the root project
dependencyLocking {
    lockAllConfigurations()
}
rootProject.buildDir = "../build"

subprojects {
    // Set each subproject's build directory relative to the root build directory
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    // Ensure subprojects are evaluated after the :app project
    project.evaluationDependsOn(":app")
    // Enable dependency locking for all configurations in subprojects
    dependencyLocking {
        lockAllConfigurations()
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}